<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景はビネット（外周を暗くする radial）を廃止し、上→下のリニア＋
         上部のドームハイライトで「上から光が当たり面が膨らんで見える」表現にする。
         4隅は下端と同じ明るさに保つ（隅だけ暗く沈ませない・2026-07-25 オーナー要望）。 -->
    <!-- 光源は左上（2026-07-25 オーナー要望: 照りは控えめに・左上から）。
         ベースも左上→右下へわずかに傾ける -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#28d29b"/>
      <stop offset="55%" stop-color="#18b284"/>
      <stop offset="100%" stop-color="#129a74"/>
    </linearGradient>
    <!-- 凸面の照り（左上が最も明るく、なだらかに消える。控えめ） -->
    <radialGradient id="dome" cx="16%" cy="4%" r="95%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="72%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 右下のリムライト（光源の対角の反射光。ごく薄く） -->
    <radialGradient id="rim" cx="62%" cy="104%" r="55%">
      <stop offset="0" stop-color="#aef2d8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#aef2d8" stop-opacity="0"/>
    </radialGradient>
    <!-- 上部のシーン（照り）。左上光源なので境界は左が低く右が高い曲線。控えめ -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="55%" stop-color="#f2e9d3"/>
      <stop offset="100%" stop-color="#e3d6b8"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35f"/>
      <stop offset="100%" stop-color="#ff852f"/>
    </linearGradient>
    <clipPath id="tileclip"><rect x="144" y="112" width="224" height="288" rx="24"/></clipPath>
  </defs>

  <!-- felt background (full bleed for maskable) -->
  <clipPath id="round"><rect width="512" height="512" rx="96"/></clipPath><g clip-path="url(#round)"><rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#dome)"/>
  <rect width="512" height="512" fill="url(#rim)"/>
  <path d="M0,0 H512 V132 Q248,224 0,204 Z" fill="url(#sheen)"/>

  <!-- tile shadow（左上光源なので右下へ落とす。背景が明るいぶん軽めに） -->
  <rect x="149" y="120" width="224" height="288" rx="24" fill="#04241a" opacity="0.28"/>
  <!-- tile -->
  <rect x="144" y="112" width="224" height="288" rx="24" fill="url(#tile)" stroke="#d3c39f" stroke-width="1.5"/>
  <!-- tile top highlight + bottom inner shade -->
  <g clip-path="url(#tileclip)">
    <rect x="144" y="112" width="224" height="150" fill="url(#hl)"/>
    <rect x="144" y="372" width="224" height="28" fill="#0a0a0a" opacity="0.10"/>
  </g>

  <!-- star (Rigel) -->
  <g transform="translate(256 258)">
    <!-- soft warm shadow -->
    <g transform="translate(3 5)" opacity="0.22">
      <path transform="scale(7.9) translate(-12 -11.1)" d="M12 1.6l2.7 6.9 7.4.4-5.8 4.6 2 7.1L12 16.9 5.7 20.6l2-7.1L1.9 8.9l7.4-.4z" fill="#7a3d0e"/>
    </g>
    <path transform="scale(7.9) translate(-12 -11.1)" d="M12 1.6l2.7 6.9 7.4.4-5.8 4.6 2 7.1L12 16.9 5.7 20.6l2-7.1L1.9 8.9l7.4-.4z" fill="url(#star)"/>
  </g>
</g></svg>
