# Cloudflare Workers 設定（API 本体 / Hono + Drizzle + D1）
# 実行: `pnpm --filter api dev`（wrangler dev）
# マイグレーション: `pnpm --filter api db:generate` → `db:migrate:local` / `db:migrate`

name = "rigel-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 本番は独自ドメインのみ公開（workers.dev の URL は無効化）。
workers_dev = false
# カスタムドメイン。CI トークンに raisha.jp ゾーン権限が必要（DEPLOY.md 参照）。
routes = [{ pattern = "api.raisha.jp", custom_domain = true }]

[[d1_databases]]
binding = "DB"                 # env.DB（src/env.ts）に対応
database_name = "rigel"
database_id = "ead7fd30-bc34-4570-afb3-f98fb2a9669a" # `wrangler d1 create rigel` で発行
migrations_dir = "migrations"

[observability]
enabled = true

# 非同期解析（docs/plans/async-analysis.md）: 画像の一時置き場（R2）と解析ジョブのキュー。
# バケットには「作成から1日で削除」のライフサイクルルールを設定済み（消し漏れの保険。
# 本線は consumer が処理後に即削除する）。
[[r2_buckets]]
binding = "ANALYSIS_TMP"               # env.ANALYSIS_TMP（src/env.ts）に対応
bucket_name = "rigel-analysis-tmp"

[[queues.producers]]
binding = "ANALYSIS_QUEUE"             # env.ANALYSIS_QUEUE（src/env.ts）に対応
queue = "rigel-analysis-jobs"

[[queues.consumers]]
queue = "rigel-analysis-jobs"
max_batch_size = 1                     # 1メッセージ=1解析（画像メモリを1件分に抑える）
max_retries = 2                        # 一過性障害のみ再送。恒久失敗は consumer が failed に落として ack
max_concurrency = 4                    # Gemini 同時実行の暴れ抑制（枠・コスト）

# レート制限（乱用・DoS 耐性）。src/interfaces/http/rate-limit.ts の RateLimiter ポートに対応。
# 未設定だと制限なし（ローカル開発・テストはそれで通す）が、本番では必ず束ねること。
# namespace_id はアカウント内で一意なら任意。period は 10 か 60 のみ。
[[unsafe.bindings]]
name = "RL_READ"                       # 公開読み取り（認証不要・IP 単位）
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_WRITE"                      # 書き込み（userId 単位。未ログインは IP）
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_ANALYZE"                    # 解析（Gemini コスト・枠のオーバーシュート抑制）
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 6, period = 60 }

# Secret で渡す（コミットしない）:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put CLOUDFLARE_AI_GATEWAY_URL   # google-ai-studio ベースURL（/v1beta の手前まで）
#   wrangler secret put SESSION_SECRET              # セッション署名鍵
#   wrangler secret put STRIPE_SECRET_KEY           # 課金（未設定なら /billing/* は 501）
#   wrangler secret put STRIPE_WEBHOOK_SECRET       # Stripe Webhook 署名シークレット（whsec_...）

[vars]
# 読み取りモデル。⚠️ AI Studio で現行の対応モデルを確認して差し替える（ハードコードしない）。
# 2026-07-24: gemini-2.5 系は新規APIキーで提供終了（404）のため 3.5 系へ更新（ListModels で確認済み）
# 手牌も flash（eval 実測: flash-lite 43%/29% → flash 86%/71%。斜めアングルに lite は力不足）
GEMINI_RIVER_MODEL = "gemini-3.5-flash"       # 河=難所
GEMINI_HAND_MODEL = "gemini-3.5-flash"        # 手牌も flash（精度優先。eval 根拠 2026-07-24）
# Google OAuth クライアントID（公開値。IDトークンの aud 検証に使う。client secret は不要）。
# web/iOS/Android で別IDを使う場合はカンマ区切りで複数指定可（並びは web, iOS, Android）。
# Android 分は Play アプリ署名鍵の SHA-1 + package で作成（2026-07-28。Play 経由の配布物は
# Google が再署名するため、アップロード鍵ではなく Play 署名鍵の SHA-1 で検証される）。
GOOGLE_CLIENT_ID = "561655423126-1r9luc1tveq2ruhkc6a23dp7ems868cq.apps.googleusercontent.com,561655423126-3i5s5c5am9u4g6pijpofomiacttrv5kh.apps.googleusercontent.com,561655423126-9tubd9i3mel1is7onfknamq1jfp9b0va.apps.googleusercontent.com"
# Sign in with Apple の許可 aud（アプリ=Bundle ID / web=Services ID。カンマ区切り。公開値）。
# 未設定なら /auth/apple は 501。退会時のトークン失効（revoke）は Secrets の
# APPLE_TEAM_ID / APPLE_KEY_ID / APPLE_PRIVATE_KEY(.p8 の中身) を設定すると有効になる。
APPLE_CLIENT_ID = "jp.co.plaria.rigel,jp.co.plaria.rigel.web"
# CORS 許可オリジン（カンマ区切り。web の本番ドメイン。localhost は既定で許可）。
ALLOWED_ORIGINS = "https://raisha.jp"
# サブスクの価格ID（公開値・秘密ではない）。RAISHA Next=¥480 / RAISHA Pro=¥1480。
STRIPE_PRICE_NEXT = "price_1TnGLeLYWvIdYJVUk7f9jGUk"
STRIPE_PRICE_PRO = "price_1TnGN3LYWvIdYJVUvg6fCymx"
# RevenueCat（アプリの IAP と web=Stripe のエンタイトルメントを横串一元管理）。
# Secret: REVENUECAT_WEBHOOK_AUTH（Webhook の Authorization 照合値）
#         REVENUECAT_STRIPE_PUBLIC_KEY（Stripe 購読の登録に使う strp_ キー）
# 開発のみ: REVENUECAT_ALLOW_SANDBOX = "true"（.dev.vars）
